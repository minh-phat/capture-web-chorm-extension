<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem trước ảnh đã chụp - Web Capture</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Bar Navigation -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="app-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="page-meta">
          <div class="page-title" id="page-title">Đang tải ảnh chụp...</div>
          <div class="page-url" id="page-url">---</div>
        </div>
      </div>

      <div class="topbar-center">
        <div class="image-info-pill" id="image-info-pill">
          <span class="info-tag" id="info-dimensions">0 x 0 px</span>
          <span class="info-separator">•</span>
          <span class="info-tag" id="info-format">PNG</span>
          <span class="info-separator">•</span>
          <span class="info-tag" id="info-size">---</span>
        </div>
      </div>

      <div class="topbar-right">
        <button class="btn btn-secondary" id="btn-copy" title="Sao chép hình ảnh vào bộ nhớ tạm">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Sao chép
        </button>

        <button class="btn btn-primary" id="btn-download" title="Tải hình ảnh về máy tính">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Tải về máy
        </button>
      </div>
    </header>

    <!-- Floating Zoom Toolbar -->
    <div class="zoom-toolbar">
      <button class="zoom-btn" id="btn-zoom-out" title="Thu nhỏ (-)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <span class="zoom-text" id="zoom-level-text">100%</span>
      <button class="zoom-btn" id="btn-zoom-in" title="Phóng to (+)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <div class="zoom-divider"></div>
      <button class="zoom-btn text-btn" id="btn-zoom-fit" title="Vừa khung hình">Vừa màn hình</button>
      <button class="zoom-btn text-btn" id="btn-zoom-100" title="Kích thước thực 100%">100%</button>
    </div>

    <!-- Main Viewport Container -->
    <main class="preview-viewport" id="preview-viewport">
      <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">Đang tự động ghép ảnh toàn trang...</div>
      </div>

      <div class="image-wrapper" id="image-wrapper" style="display: none;">
        <img id="preview-img" alt="Captured Website Screenshot" />
      </div>
    </main>
  </div>

  <script src="preview.js"></script>
</body>
</html>
